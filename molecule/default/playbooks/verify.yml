---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: "VERIFY | STAT: check binaries exist"
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop:
        - hbbs
        - hbbr
        - rustdesk-utils
      register: _verify_binaries

    - name: "VERIFY | ASSERT: all binaries exist"
      ansible.builtin.assert:
        that:
          - (_verify_binaries.results | selectattr('stat.exists', 'equalto', true) | list | length) == 3
        fail_msg: "One or more RustDesk binaries are missing in /usr/local/bin"

    - name: "VERIFY | SYSTEMD: hbbs is active"
      ansible.builtin.systemd:
        name: hbbs
      register: _verify_hbbs
      failed_when: _verify_hbbs.status.ActiveState != "active"

    - name: "VERIFY | SYSTEMD: hbbr is active"
      ansible.builtin.systemd:
        name: hbbr
      register: _verify_hbbr
      failed_when: _verify_hbbr.status.ActiveState != "active"

    - name: "VERIFY | STAT: public key file exists"
      ansible.builtin.stat:
        path: "/var/lib/rustdesk-server/id_ed25519.pub"
      register: _verify_pubkey
      failed_when: not _verify_pubkey.stat.exists

    - name: "VERIFY | STAT: version marker exists"
      ansible.builtin.stat:
        path: "/etc/rustdesk-server-version"
      register: _verify_version
      failed_when: not _verify_version.stat.exists

    - name: "VERIFY | WAIT_FOR: hbbs port 21116 is listening"
      ansible.builtin.wait_for:
        port: 21116
        timeout: 10

    - name: "VERIFY | WAIT_FOR: hbbr port 21117 is listening"
      ansible.builtin.wait_for:
        port: 21117
        timeout: 10
